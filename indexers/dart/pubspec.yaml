name: semver_audit
version: 2.4.124
description: Tool for generating and reporting a representation of a Dart package's public API.
homepage: https://github.com/Workiva/semver-audit

environment:
  sdk: ">=2.19.6 <4.0.0"

executables:
  semver_audit:

dependencies:
  analyzer: ^5.13.0
  args: ^2.3.1
  glob: ^2.0.0
  logging: ^1.1.0
  meta: ^1.16.0
  path: ^1.8.3
  pubspec_parse: ^1.0.0

dev_dependencies:
  dart_dev: ^4.0.0
  dart_style: ^2.0.0
  dependency_validator: ^3.0.0
  matcher: ^0.12.10
  mocktail: ^1.0.3
  test: ^1.21.1
  workiva_analysis_options: ^1.3.0
