on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Workiva/gha-setup-credentials@v2.1.3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest 
      - name: Install dependencies
        working-directory: ./indexers/typescript
        run: bun install

      - working-directory: ./indexers/typescript
        run: |
          bun run build
          bun pm pack

      - working-directory: ./indexers/typescript
        run: |
          bun build --compile ./src/cli.ts --outfile semver-audit-typescript

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Workiva/gha-setup-credentials@v2.1.3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest 
      - name: Install dependencies
        working-directory: ./indexers/typescript
        run: bun install

      - working-directory: ./indexers/typescript
        run: |
          bun run format --check
          bun run test

  test-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest 
      - name: Install dependencies
        run: bun install
      - run: ./test/functional/typescript/run.sh
      - name: Check for gold changes
        run: |
          git diff --quiet -- ./test/functional/typescript || {
            echo "::error:: failed the gold file check"
            echo "::error:: Run './test/functional/typescript/run.sh' to regenerate these golds"
            echo ""
            git --no-pager diff \
              --src-prefix="gold/" \
              --dst-prefix="generated/" \
              -- ./test/functional/typescript
            exit 1
          }
