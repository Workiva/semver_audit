name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish-pub:
    uses: Workiva/gha-dart-oss/.github/workflows/publish.yaml@v0.1.13
    with:
      package-path: ./indexers/dart

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Publish @workiva/semver-audit
        run: |
          bun install
          bun run build
          bun publish

      - name: Publish @workiva/semver-audit-typescript
        working-directory: ./indexers/typescript
        run: |
          bun install
          bun run build
          bun publish
