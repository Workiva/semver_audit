name: CI

on:
  pull_request:
    paths-ignore: 
      - ./indexers/**
  push:
    branches:
      - "master"
    tags:
      - "**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - run: |
          bun run build
          bun pm pack
      - run: bun build --compile ./src/cli.ts --outfile semver-audit

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Run Checks
        run: |
          bun run format --check
          bun run typecheck

      - name: Run Tests
        run: bun run test
