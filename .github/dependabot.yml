version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      gha:
        patterns: ["*"]

  - package-ecosystem: bun
    directories:
      - /
      - ./indexers/typescript
    schedule:
      interval: weekly
    groups:
      ts:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: ./indexers/dart
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: ./indexers/go/semver_audit_go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
